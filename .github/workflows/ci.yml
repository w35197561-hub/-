name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# 同一分支的新 push 自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. 前端：代码规范 + 格式 + 类型检查
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: "Frontend — Lint & Format & Type check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint + eslint)
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript type check
        run: npm run type-check

  # ──────────────────────────────────────────────────────────────────
  # 2. 前端：单元测试 + 覆盖率报告
  # ──────────────────────────────────────────────────────────────────
  unit-test:
    name: "Frontend — Unit Test & Coverage"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      # 将覆盖率报告上传为 Artifacts（7天可下载）
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # 3. 后端：类型检查 + 集成测试 + 覆盖率报告
  # ──────────────────────────────────────────────────────────────────
  server:
    name: "Server — Type check & Integration Test"
    runs-on: ubuntu-latest

    env:
      # ai.test.ts 已 mock openai，不会真实调用，用占位值即可
      # 若需要真实调用，在 GitHub Secrets 中配置 DEEPSEEK_API_KEY
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-placeholder-key' }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript type check
        working-directory: server
        run: npm run type-check

      - name: Run integration tests with coverage
        working-directory: server
        run: npm run test -- --coverage

      - name: Upload server coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # 4. 构建验证（lint + type-check 通过后才运行，避免浪费时间）
  # ──────────────────────────────────────────────────────────────────
  build:
    name: "Frontend — Build"
    runs-on: ubuntu-latest
    needs: [lint, unit-test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build-only

  # ──────────────────────────────────────────────────────────────────
  # 5. E2E 测试（Playwright）
  #    当前暂无 E2E 测试文件时跳过；有测试后自动生效
  # ──────────────────────────────────────────────────────────────────
  e2e:
    name: "E2E — Playwright"
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend server (background)
        run: npm run dev:server &
        env:
          PORT: 3001

      - name: Wait for backend server
        run: npx wait-on http://localhost:3001/api/health --timeout 30000

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
